<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registrar - Taxi MarYo</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://fonts.googleapis.com/css?family=Open+Sans:600,700&display=swap" rel="stylesheet">
<style>
:root{
  --color-logo: #FFD600;
  --color-texto: #232d3b;
}
body {
      background: #e6e7ee url('/static/images/taxi1.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Open Sans', Arial, sans-serif;
      color: #232d3b;
      margin: 0;
    }
.header {height:56px;background:var(--color-logo);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:relative;z-index:120;box-shadow:0 2px 12px #2227;}
.logo {color:var(--color-texto);font-size:1.25rem;font-weight:700;}
.menu-btn {background:none;border:none;cursor:pointer;z-index:130;}
.menu-ham {width:34px;height:34px;display:block;}
.menu-ham rect{fill:var(--color-logo);stroke:var(--color-texto);stroke-width:2;}
.menu {position:fixed;top:0;left:-90vw;width:85vw;min-width:140px;max-width:280px;height:100vh;background:#fff;box-shadow:2px 0 22px #2224;transition:left .3s;z-index:150;overflow-y:auto;display:block;}
.menu.open {left:0;}
.menu ul {list-style:none;padding:0;margin:0;width:100%;}
.menu li {width:100%;padding:0;margin:0;}
.menu a,.menu .active,.menu a:hover {display:block;color:var(--color-texto) !important;font-size:1rem !important;font-weight:700 !important;padding:14px 18px !important;background:var(--color-logo) !important;border:none !important;box-shadow:none !important;text-align:left;width:100%!important;text-decoration:none;}
.menu .active,.menu a:hover {background:var(--color-texto) !important;color:var(--color-logo) !important;}
.overlay {display:none;position:fixed;z-index:100;top:0;left:0;width:100vw;height:100vh;background:rgba(40,48,60,0.08);transition:.2s;}
.overlay.show {display:block;}
.main {padding:30px 12px;margin:50px auto 16px auto;background:#fff;border-radius:28px;box-shadow:0 4px 32px #bbb;max-width:445px;text-align:center;}
.titulo {font-size:1.45rem;font-weight:700;margin-bottom:23px;}
form {text-align:left;max-width:340px;margin:0 auto;}
.label {font-weight:600;color:#26416c;display:block;margin-top:14px;margin-bottom:3px;}
input {width:100%; padding:11px; font-size:1.09rem; border-radius:8px;border:1.5px solid #dde; margin-bottom:13px;box-sizing:border-box;}
input:focus {outline:none; border:1.5px solid #FFD600;}
.boton-link {
  display:inline-block;margin:20px auto 8px auto;padding:13px 44px;background:var(--color-logo);font-size:1.09rem;color:var(--color-texto);font-weight:700;border-radius:16px;text-decoration:none;box-shadow:0 2px 12px #ccc;border:none;transition:.2s;cursor:pointer;width:100%;box-sizing:border-box;
}
.boton-link:hover {background:var(--color-texto);color:var(--color-logo);}
.error {background:#fce8e6;color:#bc2222;padding:10px 17px;border-radius:8px;font-weight:700;margin-bottom:18px;font-size:0.95rem;}
.success {background:#e8f5e9;color:#2e7d32;padding:10px 17px;border-radius:8px;font-weight:700;margin-bottom:18px;font-size:0.95rem;}
.link-login {text-align:center;margin-top:14px;font-size:0.95rem;}
.link-login a {color:var(--color-logo);text-decoration:none;font-weight:600;}
@media (max-width:650px){
  .main{padding:20px 2vw;}
  .titulo{font-size:1.13rem;}
  .logo {font-size:1.03rem;}
}
</style>
</head>
<body>
<div class="header">
  <button class="menu-btn" onclick="abrirMenu()" aria-label="Menu">
    <svg width="34" height="34" viewBox="0 0 48 48" class="menu-ham">
      <rect y="7" width="34" height="6" rx="3"/>
      <rect y="21" width="34" height="6" rx="3"/>
      <rect y="35" width="34" height="6" rx="3"/>
    </svg>
  </button>
  <span class="logo">Taxi MarYo</span>
</div>
<div class="menu" id="menulat">
  <ul>
    <li><a href="/">Inicio</a></li>
    <li><a href="/solicitar_viaje">Solicitar viaje</a></li>
    <li><a href="/seguimiento">Ver seguimiento</a></li>
    <li><a href="/viajes">Mis viajes</a></li>
    <li><a href="/login">Login</a></li>
    <li><a href="/register" class="active">Registrar</a></li>
    <li><a href="/admin_login">Login Admin</a></li>
    <li><a href="/salir">Salir</a></li>
  </ul>
</div>
<div class="overlay" id="fondo" onclick="cerrarMenu()"></div>

<div class="main">
  <div class="titulo">Crear Cuenta</div>
  
  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}
  
  <form method="post" action="/register">
    <label class="label" for="nombre">Nombre Completo</label>
    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
    
    <label class="label" for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="tu@email.com" required>
    
    <label class="label" for="telefono">Teléfono</label>
    <input type="tel" id="telefono" name="telefono" placeholder="+55 (xx) xxxxx-xxxx">
    
    <label class="label" for="clave">Contraseña</label>
    <input type="password" id="clave" name="clave" placeholder="Mínimo 6 caracteres" required>
    
    <label class="label" for="clave_confirm">Confirmar Contraseña</label>
    <input type="password" id="clave_confirm" name="clave_confirm" placeholder="Repite tu contraseña" required>
    
    <button class="boton-link" type="submit">Crear Cuenta</button>
  </form>
  
  <div class="link-login">
    ¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a>
  </div>
  
  <a class="boton-link" href="/" style="background:#999;margin-top:14px;">Volver al inicio</a>
</div>

<script>
function abrirMenu() {
  document.getElementById('menulat').classList.add('open');
  document.getElementById('fondo').classList.add('show');
}
function cerrarMenu() {
  document.getElementById('menulat').classList.remove('open');
  document.getElementById('fondo').classList.remove('show');
}
</script>
</body>
</html>
