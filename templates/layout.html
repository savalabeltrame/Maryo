<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Taxi App{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
    {% block head %}{% endblock %}
</head>
<body style="background: #f3f3f3;">
    <nav class="navbar navbar-expand-lg navbar-light bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="/">Taxi MarYo</a>
            <div>
                <a class="btn btn-light me-1" href="/app_mobile">Solicitar viaje</a>
                <a class="btn btn-light me-1" href="/actividades">Mis viajes</a>
                <a class="btn btn-light me-1" href="/cuenta">Mi cuenta</a>
                <a class="btn btn-warning" href="/logout">Salir</a>
                {% if usuario and usuario.admin %}
                <a class="btn btn-dark ms-2" href="/admin">Admin</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer class="text-center mt-5 mb-3">
        <img src="{{ url_for('static', filename='logo.png') }}" height="32"> <br>
        <small class="text-muted">Taxi MarYo &copy; 2025</small>
    </footer>
</body>
</html>
